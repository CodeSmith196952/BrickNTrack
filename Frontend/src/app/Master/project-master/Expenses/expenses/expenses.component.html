<p-toast position="bottom-right"></p-toast>

<div class="row g-3">
    <div class="d-flex justify-content-end">

    <button
    class="btn btn-outline-secondary btn-sm"
    (click)="openProjectDialog()"
  >
    <i class="fa fa-plus me-1"></i> Add Expenses
  </button>
  </div>
  <div
    class="col-md-6 col-lg-4"
    *ngFor="let expense of expensesList; let i = index"
  >
    <mat-card class="project-card shadow-sm h-100 p-0 overflow-hidden">
      <!-- Background image container -->
      <div
        class="card-bg-image text-white h-100 d-flex flex-column justify-content-between"
       
      >
        <!-- Semi-transparent overlay for readability -->
        <div class="h-100 p-3">
          <mat-card-header class="custom text-white">
            <div
              mat-card-avatar
              class="project-avatar d-flex justify-content-center align-items-center"
            >
              <i class="fas fa-sack-dollar"></i>
            </div>
            <mat-card-title>Expense #{{ i + 1 }}</mat-card-title>
            <mat-card-subtitle>{{ expense.details }}</mat-card-subtitle>
          </mat-card-header>

          <mat-card-content class="text-dark">
            <p class="mb-1">
              <strong>Vendor Supplier:</strong> {{ expense.vendorSupplier }}
            </p>
            <p class="mb-1"><strong>Category:</strong> {{ expense.category }}</p>
            <p class="mb-1"><strong>Details:</strong> {{ expense.details }}</p>
            <p class="mb-1">
              <strong>Amount:</strong> ₹{{ expense.amount | number }}
            </p>
          </mat-card-content>

          <mat-card-actions class="d-flex justify-content-center px-3 mt-3">
            <button
              class="btn btn-outline-primary btn-sm"
              (click)="editexpenses(expense); $event.stopPropagation()"
            >
              <i class="fa fa-edit me-1"></i> Edit
            </button>
          </mat-card-actions>
        </div>
      </div>
    </mat-card>
  </div>
</div>



<p-dialog
  header="Expenses Details"
  [(visible)]="displayProjectDialog"
  [modal]="true"
  [style]="{ width: '40vw' }"
>
  <form [formGroup]="milestoneForm" autocomplete="off">
    <div class="row">
      <div class="col-sm-6 mb-3">
        <label>Vendor Supplier<sup>*</sup></label>
        <input
          type="text"
          class="form-control"
          formControlName="vendorSupplier"
       
        />
    
      </div>

      <div class="col-sm-6 mb-3">
        <label>Project Milestone Name</label>
        <select class="form-select" formControlName="projectMilestoneId">
          <option [ngValue]="null" [disabled]="true" [selected]="true">
            --Choose Option--
          </option>
          <option
            *ngFor="let project of milestoneList"
            [ngValue]="project.milestoneId"
          >
            {{ project.milestoneName }}
          </option>
        </select>
        <!-- <input
          type="text"
          class="form-control"
          formControlName="builderName"
        /> -->
      </div>

      <div class="col-sm-6 mb-3">
        <label>Amount</label>
        <input type="number" class="form-control" formControlName="amount" />
      </div>

      <div class="col-sm-6 mb-3">
        <label>Category</label>
        <input
          type="text"
          class="form-control"
          formControlName="category"
        />
      </div>



    
    </div>
  </form>

  <div class="model-footer text-end">
    <button class="btn btn-primary m-2" (click)="saveProjectExpense()">
      Submit
    </button>
    <button
      class="btn btn-secondary m-2"
      (click)="ResetDialog()"
      *ngIf="ResetVisible"
    >
      Reset
    </button>
    <button class="btn btn-danger m-2" (click)="closeProjectDialog()">
      Close
    </button>
  </div>
</p-dialog>
