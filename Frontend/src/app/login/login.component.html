







  <section id="hero" class="hero section">

    <div class="container mt-8" data-aos="fade-up" data-aos-delay="100">

      <div class="row align-items-center d-flex justify-content-center">
        <div class="col-lg-4">
          <div
          class="d-flex justify-content-center align-items-center logoImg"
        >
          <img
            src="../../assets/images/logoimg.png"
            class="img-fluid ${3|rounded-top,rounded-right,rounded-bottom,rounded-left,rounded-circle,|}"
            alt=""
          />
        </div>
          <div class="hero-image" data-aos="zoom-out" data-aos-delay="300">
            <form
            autocomplete="off"
            [formGroup]="form"
            (ngSubmit)="onSubmit()"
          >
            <div class="pt-1 pb-3 text-center">
              <p class="text-text-50 mb-4 text-black">
                Please enter your details to sign in to your account
              </p>
            
              <div class="p-inputgroup mb-4">
                <span class="p-inputgroup-addon">
                  <i class="pi pi-user"></i>
                </span>
                <input
                  formControlName="username"
                  autofocus
                  pInputText
                  class="form-control"
                  placeholder="Username"
                  [ngClass]="{
                    'is-invalid': submitted && f['username'].errors
                  }"
                />
              </div>

              <!-- <label class="d-flex mt-3" for=" ">Password</label> -->

              <div class="p-inputgroup">
                <span class="p-inputgroup-addon">
                  <i class="pi pi-lock"></i>
                </span>
                <input
                  type="password"
                  formControlName="password"
                  pInputText
                  class="form-control"
                  placeholder="Password"
                />
              </div>

           

        
            </div>
   

            <div class="text-center mt-3">

              <div class="hero-buttons">
                <a   (keyup.enter)="login()" (click)="login()" class="btn btn-primary me-0 me-sm-2 mx-1">Login</a>

              </div>

            </div>

            <div class="text-center mt-3">
              <p>Don't have an account? <a routerLink="/register" class="text-primary" style="cursor:pointer; font-weight: 500;">Sign Up</a></p>
            </div>

            <div>
              <p class="copyright text-black text-center mt-4">
                Powered by
                <a
                  class="colo"
                  href="#"
                >
                BRICK N TRACK Pvt. Ltd.</a
                >
              </p>
            </div>
          </form>

      
          </div>
        </div>
     

      </div>

 

    </div>

  </section><!-- /Hero Section -->
