<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>Recently Viewed</h2>
      <p class="text-muted mb-0">Properties you've browsed recently</p>
    </div>
    <button class="btn btn-outline-danger btn-sm" (click)="clearHistory()" *ngIf="recentProperties.length">
      <i class="fa-solid fa-trash me-1"></i> Clear History
    </button>
  </div>

  <div class="row" *ngIf="recentProperties.length > 0">
    <div class="col-sm-4 mb-4" *ngFor="let project of recentProperties">
      <mat-card class="h-100">
        <mat-card-content>
          <div style="height: 150px; border-radius: 8px; overflow: hidden;">
            <img *ngIf="project.profileImage" [src]="project.profileImage" style="width:100%; height:100%; object-fit:cover;">
            <div *ngIf="!project.profileImage" style="width:100%; height:100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display:flex; align-items:center; justify-content:center;">
              <i class="fa-solid fa-building" style="font-size: 36px; color: rgba(255,255,255,0.5);"></i>
            </div>
          </div>
          <h6 class="mt-2 mb-1">{{ project.projectName }}</h6>
          <p class="text-muted mb-1" style="font-size: 13px;">{{ project.projectAddress }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <strong><i class="fa-solid fa-indian-rupee-sign"></i> {{ project.budget | number }}</strong>
            <small class="text-muted">{{ project.builderName }}</small>
          </div>
          <a [routerLink]="['/property/detail', project.projectId]" class="btn btn-outline-primary btn-sm mt-2 w-100">View Details</a>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <div *ngIf="recentProperties.length === 0" class="text-center p-5">
    <i class="fa-solid fa-clock-rotate-left" style="font-size: 48px; color: #ccc;"></i>
    <h4 class="mt-3">No recently viewed properties</h4>
    <p class="text-muted">Properties you view will appear here.</p>
    <a routerLink="/property/explore" class="btn btn-primary mt-2">Explore Properties</a>
  </div>
</div>
